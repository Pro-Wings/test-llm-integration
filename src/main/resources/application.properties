spring.application.name=test-llm-integration
# Provide your Gemini API key (Ideally set an environment variable GEMINI_API_KEY)

#langchain4j.google-ai-gemini.chat-model.api-key=<your key here>

# Specify a model included in the free tier
#langchain4j.google-ai-gemini.chat-model.model-name=gemini-3.8-flash

#spring.ai.google.genai.api-key=<your key here>
#spring.ai.google.genai.chat.model=gemini-3.8-flash

#----properties for ollama with qwen3:1.7b model----

spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.model=qwen3:1.7b
spring.ai.ollama.chat.temperature=0.3
spring.ai.ollama.chat.num-ctx=2048
spring.ai.ollama.chat.num-predict=512
spring.ai.ollama.chat.think=false

spring.ai.ollama.init.pull-model-strategy=never


# Embedding provider and model
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text:v1.5

# Fail rather than silently truncate oversized embedding inputs
spring.ai.ollama.embedding.truncate=false

# Learning settings; tune after inspecting retrieval
app.rag.top-k=3
app.rag.similarity-threshold=0.50

#MCP client settings
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=charging-assistant-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.request-timeout=20s

spring.ai.mcp.client.toolcallback.enabled=true

spring.ai.mcp.client.streamable-http.connections.station-server.url=http://127.0.0.1:8081
spring.ai.mcp.client.streamable-http.connections.station-server.endpoint=/mcp